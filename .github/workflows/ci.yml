name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The paired nginx tree: tests/test-tuning.sh asserts what it ships
      # (NGINX_TREE).  Checked out inside the workspace because actions/checkout
      # cannot write next to it.
      - name: Checkout server-configs-nginx
        uses: actions/checkout@v5
        with:
          repository: droplinxuser/server-configs-nginx
          # 1.22 uses the nginx tree; main stays the Angie tree for 1.21.x.
          ref: nginx
          path: server-configs-nginx

      # Real server addresses must never be committed (see
      # tools/check-public-ips.sh); checked in both repositories.
      - name: No public server addresses
        run: |
          bash tools/check-public-ips.sh
          bash tools/check-public-ips.sh server-configs-nginx

      # lib/*.sh includes lib/migrate.sh, lib/nginx-build.sh,
      # lib/php-build.sh, lib/php-upgrade.sh and lib/valkey-build.sh.
      - name: Bash syntax
        run: |
          bash -n setup.sh
          for f in lib/*.sh; do bash -n "$f"; done
          bash -n tests/test-dry-run-matrix.sh
          bash -n tests/test-tuning.sh
          for f in tests/unit/*.sh; do bash -n "$f"; done
          bash -n tests/stress-site/setup-stress-site.sh
          bash -n tests/stress-site/run-stress.sh
          bash -n tests/stress-site/run-stress-remote.sh
          bash -n tests/stress-site/collect-metrics.sh
          bash -n tests/stress-site/webserver-shootout.sh
          bash -n tests/stress-site/php-server-shootout.sh
          for f in tests/bench-php-matrix/build-php-source.sh tests/bench-php-matrix/extract-php-debs.sh \
                   tests/bench-php-matrix/switch-php-arm.sh tests/bench-php-matrix/bench-php-sources.sh \
                   tests/bench-php-matrix/bench-php-probe.sh tests/bench-php-matrix/build-php-max.sh \
                   tests/bench-php-matrix/train-php-pgo.sh; do bash -n "$f"; done
          bash -n tools/diff_configs.sh
          bash -n tools/remove-anubis.sh
          bash -n tools/fleet-update.sh
          bash -n tools/php-build.sh tools/build-common.sh tools/nginx-build.sh tools/valkey-build.sh
          bash -n tests/bench-php-matrix/switch-nginx-arm.sh
          for f in tests/bench-php-matrix/switch-valkey-arm.sh tests/bench-php-matrix/bench-valkey.sh; do bash -n "$f"; done
          for f in tests/bench-php-matrix/build-php-dropin.sh tests/bench-php-matrix/bolt-php.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: |
          # ShellCheck 0.11.0 pinned by SHA-256, the version used locally.
          curl -fsSL -o /tmp/sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          export PATH="/tmp/shellcheck-v0.11.0:$PATH"
          shellcheck --version
          # Files that share variables are checked together (setup.sh with
          # lib/, the four build tools); every other file alone, in parallel.
          # One call with every file grows superlinearly: it ran for over
          # 20 minutes on the runner with the 1.22 tree.  This takes under a
          # minute and reports the same findings.
          {
            echo "setup.sh lib/*.sh"
            echo "tools/build-common.sh tools/php-build.sh tools/nginx-build.sh tools/valkey-build.sh"
            for f in tests/test-dry-run-matrix.sh tests/test-tuning.sh tests/unit/*.sh \
              tests/stress-site/setup-stress-site.sh tests/stress-site/run-stress.sh \
              tests/stress-site/run-stress-remote.sh tests/stress-site/collect-metrics.sh tools/diff_configs.sh \
              tests/stress-site/webserver-shootout.sh tests/stress-site/php-server-shootout.sh \
              tests/bench-php-matrix/build-php-source.sh tests/bench-php-matrix/extract-php-debs.sh \
              tests/bench-php-matrix/switch-php-arm.sh tests/bench-php-matrix/bench-php-sources.sh \
              tests/bench-php-matrix/bench-php-probe.sh tools/remove-anubis.sh tools/fleet-update.sh \
              tests/bench-php-matrix/build-php-dropin.sh tests/bench-php-matrix/bolt-php.sh \
              tests/bench-php-matrix/switch-nginx-arm.sh tests/bench-php-matrix/switch-valkey-arm.sh \
              tests/bench-php-matrix/bench-valkey.sh; do echo "$f"; done
          } | xargs -P "$(nproc)" -I{} sh -c 'shellcheck -S warning {}'

      - name: Dry-run matrix
        run: |
          # Each failing case also becomes an annotation (readable without
          # the job log).
          bash tests/test-dry-run-matrix.sh 2>&1 | tee /tmp/matrix.out || {
            grep '^FAIL' /tmp/matrix.out | head -n 20 | sed 's/^/::error title=Dry-run matrix::/'
            # An abort prints no FAIL line: show where it stopped.
            tail -n 15 /tmp/matrix.out | sed 's/^/::warning title=Dry-run matrix tail::/'
            exit 1
          }

      # Function-level tests: no root, no services; scratch data under /tmp.
      - name: Unit tests
        run: |
          rc=0
          for f in tests/unit/t-*.sh; do
            # Runs only inside tests/test-tuning.sh (needs its check/TMP/ROOT);
            # the Tuning tests step covers it.
            [[ $f == tests/unit/t-nginx-build.sh ]] && continue
            echo "::group::$f"
            bash "$f" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Tuning tests
        env:
          NGINX_TREE: ${{ github.workspace }}/server-configs-nginx
        run: bash tests/test-tuning.sh
