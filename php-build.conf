# php-build.conf: versions for PHP compiled from source (setup.sh 1.22).
#
# Every PHP on a setup.sh host is built from upstream sources, never from
# Ubuntu's archive or a PPA.  Every download has a second source, tried when
# the first times out or fails, and the project's own mirror after that:
#   PHP        php.net (its SHA-256)      -> GitHub php-src tag snapshot
#   LLVM       apt.llvm.org (key checked) -> LLVM's GitHub release tarball
#   redis, igbinary  pecl.php.net         -> GitHub tag snapshots
#   OpenSSL, libsodium, curl, libzip
#              the project's site         -> its GitHub release (same file,
#                                            GitHub's SHA-256)
#   zlib-ng    GitHub release archive     -> codeload snapshot (zlib's API)
#   libxml2    download.gnome.org (.sha256sum) -> GNOME GitLab / GitHub snapshot
#   GMP, GNU libiconv  ftp.gnu.org        -> ftpmirror.gnu.org
#   libpng     SourceForge                -> GitHub tag snapshot
#   libwebp    downloads.webmproject.org  -> GitHub tag snapshot
#   PCRE2, libjpeg-turbo  GitHub release  -> GitHub tag snapshot
#   SQLite     sqlite.org amalgamation (its SHA3-256) -> www2/www3.sqlite.org
#   ICU        unicode-org GitHub release (GitHub's SHA-256)
# A transfer that stalls (under 1 KB/s for 30 s) counts as failed.  Files
# without a published SHA-256 are pinned on first download: the same file
# must always hash the same.  The libraries are compiled with the same clang
# flags and linked statically into php-fpm and php.  Only glibc comes from
# Ubuntu; the unit's sd_notify() is a small static implementation.
#
# Built only when the host's extension set needs them: redis/igbinary
# (Chevereto, a Redis object cache or XenForo Redis cache), GMP (gmp),
# libsodium (sodium: WordPress), libzip (zip), SQLite (sqlite3/pdo_sqlite:
# generic apps, or a site found using SQLite) and ICU (intl: only with
# --php ext=intl; it roughly doubles the binary every site shares).
#
# One KEY=VALUE per line.  "latest" means the newest release (never an RC,
# alpha or beta), looked up when the build runs.  A pinned value builds
# exactly that version, for example LLVM_VERSION=23 (LLVM is a major
# version) or OPENSSL_VERSION=3.5.4.
#
# PHP_VERSION: "latest" is the newest release of the PHP series (X.Y) this
# host runs; the series itself is setup.sh's choice (--php ver=X.Y, or the
# newest series php.net publishes; --upgrade-php=X.Y changes it).  A pin
# must be a released X.Y.Z of that series (e.g. PHP_VERSION=8.5.13) and
# builds exactly that, older releases included.
#
# setup.sh installs this file as /usr/local/lib/setup-php/php-build.conf on
# every install and --optimize.  After editing it:
#   sudo ./setup.sh --optimize                               rebuilds what changed
#   sudo /usr/local/lib/setup-php/php-build.sh check 8.5     shows what would change
#   sudo /usr/local/lib/setup-php/php-build.sh rebuild 8.5   rebuilds now
# With "latest", the daily setup-build-refresh.timer rebuilds the active
# version in the background when any project publishes a newer release, so
# PHP and library security fixes arrive within a day.  The running build
# keeps serving until the new one has passed every check.
PHP_VERSION=latest
LLVM_VERSION=latest

# PECL extensions (Redis caches)
REDIS_VERSION=latest
IGBINARY_VERSION=latest

# Libraries linked into php-fpm and php
OPENSSL_VERSION=latest
PCRE2_VERSION=latest
ZLIB_NG_VERSION=latest
LIBXML2_VERSION=latest
LIBSODIUM_VERSION=latest
GMP_VERSION=latest
CURL_VERSION=latest
LIBJPEG_TURBO_VERSION=latest
LIBPNG_VERSION=latest
LIBWEBP_VERSION=latest
LIBZIP_VERSION=latest
LIBICONV_VERSION=latest
SQLITE_VERSION=latest
ICU_VERSION=latest
