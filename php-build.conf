# php-build.conf: versions for the compiled php-fpm.
#
# LLVM_VERSION applies to SETUP_PHP_BUILD=clang and =lean.  Every other line
# applies to =lean only (=clang builds the package's own PHP version against
# Ubuntu's libraries, so that Sury's extensions keep loading).
#
# For =lean, everything the build compiles or links comes from the project's
# own release site, never from Ubuntu's archive:
#   PHP        php.net (SHA-256 published by php.net)
#   LLVM       apt.llvm.org (clang, lld, BOLT; key checked by fingerprint)
#   PECL       pecl.php.net (redis, igbinary)
#   libraries  GitHub releases of the project (SHA-256 published by GitHub),
#              download.gnome.org (libxml2, .sha256sum), ftp.gnu.org (GMP),
#              downloads.webmproject.org (libwebp)
# The libraries are compiled with the same clang flags and linked statically
# into php-fpm.  Only glibc, libstdc++ and libsystemd (for the systemd
# unit) come from Ubuntu.
#
# One KEY=VALUE per line.  "latest" means the newest stable release (never an
# RC, alpha or beta), looked up when the build runs.  A pinned value builds
# exactly that version, for example PHP_VERSION=8.5.13 or LLVM_VERSION=23
# (LLVM is a major version).  PHP_VERSION must be a release of the installed
# X.Y and not older than its package.  The X.Y itself is setup.sh's choice
# (--upgrade-php).
#
# setup.sh installs this file as /usr/local/lib/setup-php/php-build.conf on
# every install and --optimize.  After editing it:
#   sudo ./setup.sh --optimize                                  rebuilds what changed
#   sudo /usr/local/lib/setup-php/php-fpm-build.sh check 8.5    shows what would change
#   sudo /usr/local/lib/setup-php/php-fpm-build.sh rebuild 8.5  rebuilds now
# With "latest", a daily timer (setup-php-fpm-build-refresh.timer) rebuilds
# in the background when any project publishes a newer release, so library
# security fixes arrive within a day.  The running build keeps serving until
# the new one has passed every check.
PHP_VERSION=latest
LLVM_VERSION=latest

# PECL extensions (XenForo's Redis cache)
REDIS_VERSION=latest
IGBINARY_VERSION=latest

# Libraries linked into php-fpm
OPENSSL_VERSION=latest
PCRE2_VERSION=latest
ZLIB_VERSION=latest
LIBXML2_VERSION=latest
LIBSODIUM_VERSION=latest
GMP_VERSION=latest
CURL_VERSION=latest
ICU_VERSION=latest
LIBJPEG_TURBO_VERSION=latest
LIBPNG_VERSION=latest
LIBWEBP_VERSION=latest
LIBZIP_VERSION=latest
