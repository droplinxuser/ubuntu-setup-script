# valkey-build.conf: versions for the compiled Valkey (SETUP_VALKEY_BUILD=clang
# or --source=valkey).
#
# Everything the build compiles comes from the project's own release, never
# from Ubuntu's archive (jemalloc and Lua are Valkey's bundled copies):
#   Valkey     GitHub tag archive         -> codeload snapshot (valkey-io/valkey)
#   LLVM       apt.llvm.org (key checked) -> LLVM's GitHub release tarball
# Files without a published SHA-256 are pinned on first download.
#
# One KEY=VALUE per line.  "latest" means the newest stable release, looked
# up when the build runs; a pinned value builds exactly that version (LLVM is
# a major version).  VALKEY_VERSION must not be older than the installed
# package.  When /etc/valkey/valkey.conf persists data (save or appendonly),
# "latest" means the newest release of the package's X.Y series: an older
# server cannot read a newer RDB/AOF if the build is ever removed.
#
# setup.sh installs this file as /usr/local/lib/setup-valkey/valkey-build.conf
# on every install and --optimize.  After editing it:
#   sudo ./setup.sh --optimize                                    rebuilds what changed
#   sudo /usr/local/lib/setup-valkey/valkey-build.sh check        shows what would change
#   sudo /usr/local/lib/setup-valkey/valkey-build.sh rebuild      rebuilds now
# With "latest", a daily timer (setup-valkey-build-refresh.timer) rebuilds in
# the background when Valkey or LLVM publishes a newer release.
VALKEY_VERSION=latest
LLVM_VERSION=latest
