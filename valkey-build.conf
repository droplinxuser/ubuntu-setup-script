# valkey-build.conf: versions for Valkey, which setup.sh compiles from source
# (1.22.0: there is no valkey-server package behind it).
#
# Everything the build compiles comes from the project's own release, never
# from Ubuntu's archive (jemalloc and Lua are Valkey's bundled copies):
#   Valkey     GitHub release archive, checked against the SHA-256 in
#              valkey-io/valkey-hashes (a mismatch stops the build; only
#              when that repository is unreachable is the archive pinned on
#              first download, and the build reports it).  While it does not
#              list a new release yet, "latest" builds the newest release it
#              does list, and a pinned version it does not list is refused
#              (unless build.info already records that archive's hash)
#   LLVM       apt.llvm.org (key checked) -> LLVM's GitHub release tarball
#
# One KEY=VALUE per line.  "latest" means the newest stable release, looked
# up when the build runs; a pinned value builds exactly that version (LLVM is
# a major version).  Valkey keeps RDB snapshots by default (1.22.5); a newer
# release reads an older RDB, so "latest" stays the newest release.  When
# /etc/valkey/valkey.conf persists data (save or appendonly), the build
# never goes below the version of the server that wrote it (the active
# build, or the valkey-server package during the 1.22 migration): an older
# server cannot read a newer RDB/AOF.  With AOF (appendonly yes) "latest"
# also stays inside that server's X.Y series.
#
# setup.sh installs this file as /usr/local/lib/setup-valkey/valkey-build.conf
# on every install and --optimize.  After editing it:
#   sudo ./setup.sh --optimize                                    rebuilds what changed
#   sudo /usr/local/lib/setup-valkey/valkey-build.sh check        shows what would change
#   sudo /usr/local/lib/setup-valkey/valkey-build.sh rebuild      rebuilds now
# With "latest", the daily setup-build-refresh.timer rebuilds in the
# background when Valkey or LLVM publishes a newer release; the running
# build serves until the new one has answered PING, a Lua EVAL and SAVE on a
# private socket.  A CPU change rebuilds exactly the recorded versions from
# the cached sources (setup-build-cpu.service).
VALKEY_VERSION=latest
LLVM_VERSION=latest
