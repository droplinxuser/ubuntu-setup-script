# Managed by setup.sh: install as /etc/security/limits.d/99-setup.conf.
# 1,048,576 descriptors matches the minimum fs.nr_open this script sets, so
# PAM can always raise the hard limit. Service units that need less use a
# smaller LimitNOFILE drop-in (Angie/PHP 524288, MariaDB 1048576).
elasticsearch soft nofile 1048576
elasticsearch hard nofile 1048576
mysql         soft nofile 1048576
mysql         hard nofile 1048576
valkey        soft nofile 1048576
valkey        hard nofile 1048576
root          soft nofile 1048576
root          hard nofile 1048576
tinyproxy     soft nofile 1048576
tinyproxy     hard nofile 1048576
www-data      soft nofile 1048576
www-data      hard nofile 1048576
angie         soft nofile 1048576
angie         hard nofile 1048576
*             soft nofile 1048576
*             hard nofile 1048576
