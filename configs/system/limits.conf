# Managed by setup.sh: install as /etc/security/limits.d/99-setup.conf.
# 1,048,576 descriptors stays below fs.nr_open (never lowered by this script,
# at least 2,097,152), so PAM can always raise the hard limit.  PAM limits
# do not apply to systemd
# services: each unit gets its LimitNOFILE from nofile_plan (lib/optimize.sh),
# sized with nginx, PHP-FPM, Valkey, MariaDB and Elasticsearch together
# (floors: 524288 for the compiled units, 1048576 for MariaDB and
# Elasticsearch).  nginx workers run as www-data, so there is no nginx (or
# angie) account to list here.
elasticsearch soft nofile 1048576
elasticsearch hard nofile 1048576
mysql         soft nofile 1048576
mysql         hard nofile 1048576
valkey        soft nofile 1048576
valkey        hard nofile 1048576
root          soft nofile 1048576
root          hard nofile 1048576
tinyproxy     soft nofile 1048576
tinyproxy     hard nofile 1048576
www-data      soft nofile 1048576
www-data      hard nofile 1048576
*             soft nofile 1048576
*             hard nofile 1048576
