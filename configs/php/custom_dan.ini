; Baseline php.ini fragment installed by setup.sh as conf.d/custom_dan.ini.
;
; One owner per directive: the hardware-derived values (memory_limit,
; realpath_cache_size/ttl, max_execution_time/input_time, opcache.*, the
; mysqlnd/mysqli sockets) are written to conf.d/zz-setup-optimize.ini by
; tune_php_fpm_version(), which sorts after this file.  They are deliberately
; NOT repeated here: the old copy said `opcache.jit = disable` while the
; managed profile enables the tracing JIT, so which value a worker used
; depended on whether the zz file existed at all.  Keep only settings that
; are not hardware-dependent.
;
; Do not set cgi.fix_pathinfo=0 globally. With that value PHP-FPM uses
; PATH_TRANSLATED instead of SCRIPT_FILENAME; vhosts that set
; PATH_TRANSLATED to $document_root$fastcgi_path_info then receive the
; document root (no .php) and reject every pretty URL. The optimizer repairs
; that mapping, but the default stays at PHP's safe runtime value.

expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

max_input_nesting_level = 128
max_input_vars = 10000
mysqlnd.collect_statistics = Off
mysqlnd.collect_memory_statistics = Off

date.timezone = Asia/Manila

; All PHP errors go to the central log tree so the whole stack can be
; collected from /var/www/logs with one command.
log_errors = On
error_log = /var/www/logs/php/php-error.log
; E_STRICT has been unused since PHP 8.0 and the constant is deprecated in
; PHP 8.4; E_ALL already excludes it, so it is not referenced here.
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off

; Percent of the OPcache a restart may waste before it is rebuilt.  The size
; and the JIT live in the managed profile.
opcache.max_wasted_percentage = 10

upload_max_filesize = 100M
post_max_size = 100M

; PHP session settings are intentionally left at their defaults. Global
; overrides such as cookie_secure=1, strict mode or longer session IDs broke
; Joomla/Polr logins on mixed hosts. Hardening is opt-in:
;   sudo SETUP_PHP_SESSION_HARDENING=1 ./setup.sh --optimize

; Keep exec/shell_exec/proc_open available: Chevereto (ffmpeg), Lychee
; (imagick/ffmpeg) and some WordPress plugins need them. Blocking them causes
; hard-to-diagnose upload/video failures. Only the diagnostic helpers that no
; production app should call are disabled by default.
disable_functions = show_source,phpinfo

; Chev
;disable_functions = show_source,system,shell_exec,passthru,exec,phpinfo,popen,curl_multi_exec

; Lychee
;disable_functions = show_source,system,shell_exec,passthru,phpinfo,popen,curl_exec,curl_multi_exec

; WP
;disable_functions = php_uname,getmyuid,getmypid,passthru,leak,listen,diskfreespace,tmpfile,link,ignore_user_abord,shell_exec,dl,exec,system,highlight_file,source,show_source,fpaththru,virtual,posix_ctermid,posix_getcwd,posix_getegid,posix_geteuid,posix_getgid,posix_getgrgid,posix_getgrnam,posix_getgroups,posix_getlogin,posix_getpgid,posix_getpgrp,posix_getpid,posix_getppid,posix_getpwnam,posix_getpwuid,posix_getrlimit,posix_getsid,posix_getuid,posix_isatty,posix_kill,posix_mkfifo,posix_setegid,posix_seteuid,posix_setgid,posix_setpgid,posix_setsid,posix_setuid,posix_times,posix_ttyname,posix_uname,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,phpinfo,popen,curl_exec,curl_multi_exec
