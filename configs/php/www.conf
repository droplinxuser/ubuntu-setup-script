; [www] pool of every PHP version (setup.sh configs/php/www.conf).
;
; Written to /etc/php/X.Y/fpm/pool.d/www.conf by php_build_layout only when
; that file is absent: an existing pool (an operator's, or one adopted from
; the Sury package by the 1.22 migration) is kept, and --optimize tunes the
; managed keys in place (pm.max_children, pm.max_requests, listen).  The
; [global] settings (pid, error_log, rlimits) are in fpm/php-fpm.conf.
; One template for every version php.net publishes: nothing here depends on
; X.Y.  Only the active version (/etc/php/setup-active) runs, so the shared
; socket below has one owner.
[www]
user  = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.backlog = 65535

listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static

; (PHP budget MB) / 96
pm.max_children = 64

; CPU_thread x 1024
pm.max_requests = 65536

rlimit_files = 524288
rlimit_core = 0

request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /var/www/logs/php/php-fpm-slow.log
catch_workers_output = yes
security.limit_extensions = .php
