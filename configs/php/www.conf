; Managed by setup.sh (php_build_layout): [www] pool of every PHP version
; (setup.sh configs/php/www.conf).  Keep the first line: it marks the file
; as setup.sh's.
;
; Written to /etc/php/X.Y/fpm/pool.d/www.conf by php_build_layout when that
; file is absent, and rewritten from this template while it still carries
; the first line above.  On a rewrite, user, group, listen*, pm*, slowlog
; and access.* keep the values the file has (--optimize tunes pm.max_children,
; pm.max_requests and listen in place; an operator's TCP listener stays), and
; every directive the template does not have is kept at the end.  Remove the
; first line to make the file entirely your own.  A pool without it (an
; operator's, or one adopted from the Sury package by the 1.22 migration) is
; never rewritten.  The [global] settings (pid, error_log, rlimits) are in
; fpm/php-fpm.conf; a [global] section in a pool file is commented out.
; One template for every version php.net publishes: nothing here depends on
; X.Y.  Only the active version (/etc/php/setup-active) runs, so the shared
; socket below has one owner.
[www]
user  = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.backlog = 65535

listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = static

; (PHP budget MB) / 96
pm.max_children = 64

; CPU_thread x 1024
pm.max_requests = 65536

rlimit_files = 524288
rlimit_core = 0

request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /var/www/logs/php/php-fpm-slow.log
catch_workers_output = yes
security.limit_extensions = .php
