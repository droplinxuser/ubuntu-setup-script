[Service]
LimitNOFILE=524288
LimitCORE=0
# Stop gracefully: on SIGQUIT the workers finish their request and close
# their persistent MariaDB connections.  The default SIGTERM kills them
# mid-connection and MariaDB logs one "Aborted connection" warning per
# worker holding one (12 per restart for XenForo's p:localhost); same
# restart time (244 ms measured).
KillSignal=SIGQUIT
# A busy worker must not hold systemd in "deactivating" for 90s on restart.
TimeoutStopSec=15
# PHP-FPM writes its central logs below /var/www/logs.
UMask=0027
