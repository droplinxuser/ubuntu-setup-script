# nginx-build.conf: versions for the compiled nginx (SETUP_NGINX_BUILD=clang).
#
# Everything the build compiles or links comes from the project's own
# release sites, never from Ubuntu's archive.  Every download has a second
# source, tried when the first times out, stalls or fails:
#   nginx      download.angie.software    -> GitHub tag snapshot (webserver-llc/angie)
#   LLVM       apt.llvm.org (key checked) -> LLVM's GitHub release tarball
#   OpenSSL    openssl.org                -> its GitHub release (same file, GitHub's SHA-256)
#   zlib-ng    GitHub release archive     -> codeload snapshot (zlib-ng/zlib-ng; zlib's API,
#                                            21 % less gzip CPU than the package's zlib)
#   PCRE2      GitHub release             -> GitHub tag snapshot (GitHub is its only home)
#   Brotli     GitHub release archive     -> codeload snapshot (google/brotli)
#   ngx_brotli GitHub commit archive      -> codeload snapshot (google/ngx_brotli
#                                            publishes no releases: "latest" is
#                                            the newest commit)
# Files without a published SHA-256 are pinned on first download.
#
# One KEY=VALUE per line.  "latest" means the newest stable release, looked
# up when the build runs; a pinned value builds exactly that version (LLVM is
# a major version, NGX_BROTLI a commit).  NGINX_VERSION must not be older
# than the installed package.
#
# setup.sh installs this file as /usr/local/lib/setup-nginx/nginx-build.conf
# on every install and --optimize.  After editing it:
#   sudo ./setup.sh --optimize                                   rebuilds what changed
#   sudo /usr/local/lib/setup-nginx/nginx-build.sh check         shows what would change
#   sudo /usr/local/lib/setup-nginx/nginx-build.sh rebuild       rebuilds now
# With "latest", a daily timer (setup-nginx-build-refresh.timer) rebuilds in
# the background when any project publishes a newer release.
NGINX_VERSION=latest
LLVM_VERSION=latest
OPENSSL_VERSION=latest
PCRE2_VERSION=latest
ZLIB_NG_VERSION=latest
BROTLI_VERSION=latest
NGX_BROTLI_VERSION=latest
