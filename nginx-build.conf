# nginx-build.conf: versions for the nginx that setup.sh compiles (1.22.0).
#
# nginx is always built from source: the nginx.org mainline release, lean
# (only the modules server-configs-nginx uses, Brotli compiled in statically),
# branding stripped, OpenSSL, PCRE2 and zlib-ng linked statically.  Everything
# the build compiles or links comes from the project's own release site,
# never from Ubuntu's archive.  Every download has a second source, tried
# when the first times out, stalls or fails:
#   nginx      nginx.org/download (PGP)  -> its GitHub release (nginx/nginx), same
#                                           tarball, same .asc; the project mirror's
#                                           copy is checked the same way.  The .asc
#                                           must verify against the nginx.org signing
#                                           keys pinned in tools/build-common.sh (fail
#                                           closed: no first-use trust for nginx)
#   LLVM       apt.llvm.org (key checked) -> LLVM's GitHub release tarball
#   OpenSSL    openssl.org                -> its GitHub release (same file, GitHub's SHA-256)
#   zlib-ng    GitHub release archive     -> codeload snapshot (zlib-ng/zlib-ng; zlib's API,
#                                            21 % less gzip CPU than Ubuntu's zlib)
#   PCRE2      GitHub release             -> GitHub tag snapshot (GitHub is its only home)
#   Brotli     GitHub release archive     -> codeload snapshot (google/brotli)
#   ngx_brotli GitHub commit archive      -> codeload snapshot (google/ngx_brotli
#                                            publishes no releases: "latest" is
#                                            the newest commit)
# Files without a published SHA-256 or signature are pinned on first download.
#
# One KEY=VALUE per line.  "latest" means the newest release, looked up when
# the build runs; a pinned value builds exactly that version (LLVM is a major
# version, NGX_BROTLI a commit).  NGINX_VERSION=latest is the highest version
# nginx.org publishes, which is the mainline branch (odd minor).
#
# NGINX_FALLBACK: the newest version the branding patch is known to apply to.
# When the newest mainline changes one of the patched source lines (the tool
# counts every patch), a fresh install or migration builds the newest of
# NGINX_FALLBACK and the host's last patched build (build.info patched_ok=)
# that is not newer than the failing version, and reports the skipped
# version.  The daily refresh never falls back while nginx serves (it keeps
# the running binary and retries the next day); on a host left down by a
# failed CPU rebuild it builds the same fallback, since nothing serves that
# could be downgraded.  Bumped only after the newest mainline passed
# the patch counts and the 404 branding check.
#
# setup.sh installs this file as /usr/local/lib/setup-nginx/nginx-build.conf
# on every install and --optimize.  After editing it:
#   sudo ./setup.sh --optimize                                   rebuilds what changed
#   sudo /usr/local/lib/setup-nginx/nginx-build.sh check         shows what would change
#   sudo systemctl start setup-nginx-build                       rebuilds now (background)
# With "latest", the daily setup-build-refresh.timer rebuilds in the
# background when any project publishes a newer release; the running nginx
# keeps serving until the new binary passed its checks, then takes over
# through nginx's in-place binary upgrade (no dropped connections).
NGINX_VERSION=latest
NGINX_FALLBACK=1.31.10
LLVM_VERSION=latest
OPENSSL_VERSION=latest
PCRE2_VERSION=latest
ZLIB_NG_VERSION=latest
BROTLI_VERSION=latest
NGX_BROTLI_VERSION=latest
