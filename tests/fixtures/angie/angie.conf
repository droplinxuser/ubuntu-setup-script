worker_processes auto;

# Deliberately placed before the http block so a loose `http[[:space:]]*`
# anchor would insert the body-buffer directive in the wrong place.
http2 on;

events {
    worker_connections 512;
}

http {
  keepalive_timeout 30s;

  upstream local_php {
    zone localphp_zone 256k;
    server 127.0.0.1:9000;
    keepalive 64;
  }

  include http.d/*.conf;
  include conf.d/*.conf;
}
